<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lalampp (pywebview)</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 2rem; }
      button { font-size: 1rem; padding: .5rem 1rem; }
      pre { background:#f6f8fa; padding:1rem; border-radius:6px; }
    </style>
  </head>
  <body>
    <h1>Lalampp (pywebview)</h1>
    <p>This app runs inside pywebview and talks to a Flask backend.</p>
    <button id="ping">Ping server</button>
    <pre id="out"></pre>

    <script>
      document.getElementById('ping').addEventListener('click', async () => {
        try {
          const res = await fetch('/api/ping');
          const data = await res.json();
          document.getElementById('out').textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          document.getElementById('out').textContent = 'Error: ' + err;
        }
      });
    </script>
  </body>
</html>
